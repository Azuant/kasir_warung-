<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WARUNG IRWAN MARINIR</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <style>
    body{font-family:'Segoe UI',Arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#1e3a8a;margin:0}
    .box{background:#fff;padding:30px;border-radius:10px;width:320px;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
    h2{text-align:center;color:#1e3a8a;margin-bottom:20px}
    input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;font-size:16px}
    button{width:100%;padding:12px;background:#1e3a8a;color:white;border:none;border-radius:5px;font-weight:bold;font-size:16px;cursor:pointer}
    #error{color:red;text-align:center;font-size:14px;margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <h2>Login Kasir</h2>
    <form onsubmit="login(event)">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">MASUK</button>
      <p id="error"></p>
    </form>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCHwvOsZ8AjQpc64yHTxMxebRsqp88yx1Q",
    authDomain: "kasir-sembako-8972f.firebaseapp.com",
    projectId: "kasir-sembako-8972f",
    storageBucket: "kasir-sembako-8972f.firebasestorage.app",
    messagingSenderId: "669992382893",
    appId: "1:669992382893:web:53cf405273cf45723b3124"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function login(e){
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        window.location.href = "index.html";
      })
      .catch(() => {
        document.getElementById('error').innerText = "Email atau Password Salah!";
      });
  }
</script>
</body>
</html>
