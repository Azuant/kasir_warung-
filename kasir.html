<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARUNG IRWAN MARINIR - KASIR PRO V7.0 SUPABASE</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F5F5F5;--box:#fff;--text:#000;--primary:#1565C0;--border:#ddd;}
body.dark{--bg:#121212;--box:#1E1E1E;--text:#E0E0E0;--primary:#42A5F5;--border:#333;}
*{box-sizing:border-box;}
body{font-family:'Segoe UI',Arial;margin:0;background:var(--bg);color:var(--text);}
.header{background:var(--primary);color:white;padding:0;text-align:left;font-weight:bold;position:sticky;top:0;z-index:10;}
.running-text{width:calc(100% - 110px);white-space:nowrap;overflow:hidden;line-height:50px;}
.running-text span{display:inline-block;padding-left:100%;animation:jalan 10s linear infinite;font-size:20px;letter-spacing:2px;}
@keyframes jalan{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
.btn-header{position:absolute;top:10px;right:10px;z-index:11;display:flex;gap:5px;}
.wrap{padding:10px;max-width:1200px;margin:auto;}
.box{background:var(--box);border-radius:10px;padding:15px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
input,button{width:100%;padding:12px;margin:5px 0;border-radius:5px;border:1px solid var(--border);font-size:16px;background:var(--box);color:var(--text);}
button{background:var(--primary);color:white;border:none;font-weight:bold;cursor:pointer;transition:0.2s;}
button:hover{opacity:0.85;}
button.hijau{background:#2E7D32;} button.merah{background:#C62828;} button.kuning{background:#F9A825;color:#000;} button.ungu{background:#6A1B9A;}
.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.list{max-height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border);}
.btn-group{display:flex;gap:5px;}
.btn-group button{width:auto;padding:8px 14px;font-size:14px;margin:0;}
.badge{background:#C62828;color:white;padding:2px 6px;border-radius:12px;font-size:11px;margin-left:5px;font-weight:bold;}
.badge.kuning{background:#F9A825;color:#000;}
.badge.hijau{background:#2E7D32;color:#000;}
.total{font-size:32px;color:var(--primary);font-weight:bold;text-align:center;}
.keranjang-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);}
.hidden{display:none;}
#struk{font-family:monospace;font-size:14px;white-space:pre-line;background:var(--bg);padding:10px;border-radius:8px;}
canvas{background:var(--box);border-radius:8px;padding:10px;width:100%;}
#reader-kasir,#reader-barang{width:100%;border-radius:10px;overflow:hidden;margin-top:10px;min-height:250px;background:#000;}
.filter-box{padding:10px;background:var(--box);border-radius:8px;margin:10px 0;}
#halamanLogin{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--primary);display:flex;justify-content:center;align-items:center;}
.loginBox{background:var(--box);padding:30px;border-radius:15px;width:90%;max-width:400px;box-shadow:0 5px 20px rgba(0,0,0,0.2);}
.loginBox h2{text-align:center;margin-bottom:20px;color:var(--primary);}
</style>
</head>
<body>

<div id="halamanLogin">
 <div class="loginBox">
  <h2>🔒 LOGIN KASIR</h2>
  <input id="userLogin" type="text" placeholder="Username" value="admin">
  <input id="passLogin" type="password" placeholder="Password" value="P">
  <button class="hijau" onclick="cekLogin()">MASUK</button>
  <p style="text-align:center;font-size:12px;margin-top:10px;">Default: admin / P</p>
 </div>
</div>

<div id="appUtama" class="hidden">
 <div class="header">
  <div class="running-text"><span id="namaWarungHeader">WARUNG IRWAN MARINIR - SELAMAT DATANG</span></div>
 </div>
 <div class="btn-header">
  <button onclick="logout()" style="width:auto;padding:8px 12px;background:#C62828;">🚪</button>
  <button onclick="toggleTema()" style="width:auto;padding:8px 12px;">🌙</button>
 </div>

 <div class="wrap">
  <div class="box menu">
   <button onclick="show('kasir')">KASIR</button>
   <button class="hijau" onclick="show('barang')">BARANG</button>
   <button class="kuning" onclick="show('laporan')">LAPORAN</button>
   <button class="ungu" onclick="show('grafik')">GRAFIK</button>
   <button class="merah" onclick="show('setting')">SETTING</button>
  </div>

  <div id="kasir" class="box">
   <button class="ungu" onclick="toggleScanner('kasir')">🔍 SCAN BARCODE</button>
   <div id="reader-kasir" class="hidden"><button class="merah" onclick="stopScanner()" style="position:absolute;top:10px;right:10px;z-index:2;width:auto;">TUTUP</button></div>
   <input id="cari" type="text" placeholder="🔍 Cari nama barang..." onkeyup="tampilKasir()">
   <div id="listBarangKasir" class="list"></div>
   <h3>KERANJANG</h3><div id="keranjang">Kosong</div>
   <h2 class="total">TOTAL: Rp<span id="total">0</span></h2>
   <button class="hijau" onclick="bayar()">BAYAR & CETAK STRUK</button>
  </div>
 </div>
</div>

<script>
const SUPABASE_URL = 'https://ofrtchcbeectkythnolc.supabase.co';
const SUPABASE_KEY = 'PASTE_ANON_KEY_KAMU_DISINI'; // <-- GANTI INI DULU
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let keranjang = [];
let scanner;

function cekLogin(){
 const u = document.getElementById('userLogin').value;
 const p = document.getElementById('passLogin').value;
 if(u === 'admin' && p === 'P'){
  document.getElementById('halamanLogin').classList.add('hidden');
  document.getElementById('appUtama').classList.remove('hidden');
  tampilKasir();
 } else { alert('Username/Password salah'); }
}
function logout(){ location.reload(); }
function show(id){ document.querySelectorAll('.wrap .box').forEach(b=>b.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
async function tampilKasir(){ /* isi fungsi ambil dari supabase */ }
async function bayar(){ /* isi fungsi insert ke supabase */ }
function toggleTema(){ document.body.classList.toggle('dark'); }
function toggleScanner(id){} function stopScanner(){}
</script>
</body>
</html>
