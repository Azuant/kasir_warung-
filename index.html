<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARUNG IRWAN MARINIR - KASIR PRO FIREBASE V8</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#f5f5f5; --box:#fff; --text:#000; --primary:#1565c0; --border:#ddd;}
body.dark{--bg:#121212; --box:#1e1e1e; --text:#e0e0e0; --primary:#42a5f5; --border:#333;}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial; margin:0; background:var(--bg); color:var(--text)}
.header{background:var(--primary); color:white; padding:0; text-align:left; font-size:18px; font-weight:bold; position:sticky; top:0; z-index:10; height:50px; overflow:hidden}
.running-text{width:calc(100% - 110px); white-space:nowrap; overflow:hidden; line-height:50px}
.running-text span{display:inline-block; padding-left:100%; animation:jalan 10s linear infinite; font-size:20px; letter-spacing:2px}
@keyframes jalan{0%{transform:translateX(0)} 100%{transform:translateX(-100%)}}
.btn-header{position:absolute; top:8px; right:10px; z-index:11; display:flex; gap:5px}
.wrap{padding:10px; max-width:1200px; margin:auto}
.box{background:var(--box); border-radius:10px; padding:15px; margin-bottom:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1); border:1px solid var(--border)}
input,button,textarea{width:100%; padding:12px; margin:5px 0; border-radius:8px; border:1px solid var(--border); font-size:16px; background:var(--box); color:var(--text)}
button{background:var(--primary); color:white; border:none; font-weight:bold; cursor:pointer; transition:0.2s}
button:hover{opacity:0.85}
button.hijau{background:#2e7d32} button.merah{background:#c62828} button.kuning{background:#f9a825; color:#000} button.ungu{background:#6a1b9a} button.biru{background:#0277bd} button.orange{background:#e65100}
.menu{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px}
.list{max-height:400px; overflow-y:auto; border:1px solid var(--border); border-radius:8px}
.item{display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid var(--border); gap:10px}
.btn-group{display:flex; gap:8px}
.btn-group button{width:auto; padding:8px 14px; font-size:14px; margin:0}
.badge{background:#c62828; color:white; padding:2px 6px; border-radius:12px; font-size:11px; margin-left:5px; font-weight:bold}
.badge.kuning{background:#f9a825; color:#000}
.badge.hijau{background:#2e7d32}
.total{font-size:32px; color:var(--primary); font-weight:bold; text-align:center}
.keranjang-item{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border)}
.hidden{display:none!important}
#struk{font-family:monospace; font-size:14px; white-space:pre-line; background:var(--bg); padding:10px; border-radius:8px}
#halamanLogin{position:fixed; top:0; left:0; width:100%; height:100%; background:var(--primary); display:flex; justify-content:center; align-items:center; z-index:9999}
.loginBox{background:var(--box); padding:30px; border-radius:15px; width:90%; max-width:400px; box-shadow:0 5px 20px rgba(0,0,0,0.3)}
.loginBox h2{text-align:center; margin-bottom:20px; color:var(--primary)}
.status{padding:8px; border-radius:8px; text-align:center; font-weight:bold; margin-bottom:10px}
.status.online{background:#2e7d32; color:white}
.status.offline{background:#c62828; color:white}
</style>
</head>
<body>

<div id="halamanLogin">
  <div class="loginBox">
    <h2>🔒 LOGIN FIREBASE</h2>
    <input id="emailLogin" type="email" placeholder="Email">
    <input id="passLogin" type="password" placeholder="Password">
    <button class="hijau" onclick="loginFirebase()">MASUK</button>
    <button class="biru" onclick="daftarFirebase()">DAFTAR BARU</button>
    <p style="text-align:center; font-size:12px; margin-top:10px">Buat akun dulu di Firebase > Authentication</p>
  </div>
</div>

<div id="appUtama" class="hidden">
<div class="header">
  <div class="running-text">
    <span id="namaWarungHeader">WARUNG IRWAN MARINIR - ONLINE</span>
  </div>
</div>
<div class="btn-header">
  <button onclick="logout()" style="width:auto; padding:8px 12px; background:#c62828">🚪</button>
  <button onclick="toggleTema()" style="width:auto; padding:8px 12px">🌙</button>
</div>

<div class="wrap">
  <div id="statusKoneksi" class="status offline">OFFLINE</div>
  <div class="box menu">
    <button onclick="show('kasir')">KASIR</button>
    <button class="hijau" onclick="show('barang')">BARANG</button>
    <button class="kuning" onclick="show('laporan')">LAPORAN</button>
    <button class="ungu" onclick="show('grafik')">GRAFIK</button>
    <button class="merah" onclick="show('setting')">SETTING</button>
  </div>
  
  <div id="kasir" class="box">
    <h3>KASIR</h3>
    <input id="cari" onkeyup="cariBarang()" placeholder="Cari Nama/Kode/Scan QR">
    <div id="hasilCari" class="list"></div>
    <h4>KERANJANG</h4>
    <div id="keranjang" class="list"></div>
    <div class="total">TOTAL: Rp<span id="total">0</span></div>
    <input id="bayar" type="number" placeholder="Uang Bayar" onkeyup="hitungKembali()">
    <div class="total">KEMBALI: Rp<span id="kembali">0</span></div>
    <button class="hijau" onclick="bayar()">BAYAR & CETAK STRUK</button>
    <div id="struk"></div>
  </div>

  <div id="barang" class="box hidden">
    <h3>DATA BARANG</h3>
    <input id="kode" placeholder="Kode Barang">
    <input id="nama" placeholder="Nama Barang">
    <input id="harga" type="number" placeholder="Harga Jual">
    <input id="stok" type="number" placeholder="Stok">
    <button class="hijau" onclick="simpanBarang()">SIMPAN BARANG</button>
    <button class="kuning" onclick="resetForm()">BATAL EDIT</button>
    <div id="daftarBarang" class="list"></div>
  </div>

  <div id="laporan" class="box hidden">
    <h3>LAPORAN PENJUALAN</h3>
    <div id="daftarLaporan"></div>
    <button class="merah" onclick="resetSemua()">RESET SEMUA DATA</button>
  </div>

  <div id="grafik" class="box hidden">
    <h3>GRAFIK 7 HARI TERAKHIR</h3>
    <canvas id="grafikCanvas" height="200"></canvas>
  </div>

  <div id="setting" class="box hidden">
    <h3>SETTING</h3>
    <input id="namaWarung" placeholder="Nama Warung">
    <input id="batasStok" type="number" placeholder="Batas Notifikasi Stok Habis">
    <button class="hijau" onclick="simpanSetting()">SIMPAN SETTING</button>
  </div>
</div>
</div>

<script>
// 1. CONFIG FIREBASE KAMU
const firebaseConfig = {
  apiKey: "AIzaSyCHwvOsZ8AjQpc64yHTxMxebRsqp88yx1Q",
  authDomain: "kasir-sembako-8972f.firebaseapp.com",
  databaseURL: "https://kasir-sembako-8972f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kasir-sembako-8972f",
  storageBucket: "kasir-sembako-8972f.firebasestorage.app",
  messagingSenderId: "669992382893",
  appId: "1:669992382893:web:53cf405273cf45723b3124"
};

// 2. INIT
firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database();

let db = {barang:[], laporan:[], nama:"WARUNG IRWAN MARINIR", tema:"terang", batasStok:5};
let keranjang = []; let editId = null;

// 3. CEK LOGIN
firebase.auth().onAuthStateChanged(user => {
  if(user){
    document.getElementById('halamanLogin').style.display = 'none';
    document.getElementById('appUtama').classList.remove('hidden');
    document.getElementById('statusKoneksi').className = 'status online';
    document.getElementById('statusKoneksi').innerText = 'ONLINE - Data Sinkron';
    loadDataDariFirebase();
  } else {
    document.getElementById('halamanLogin').style.display = 'flex';
    document.getElementById('appUtama').classList.add('hidden');
  }
});

function loginFirebase(){
  let email = document.getElementById('emailLogin').value;
  let pass = document.getElementById('passLogin').value;
  firebase.auth().signInWithEmailAndPassword(email, pass).catch(e=>alert('Login Gagal: '+e.message));
}
function daftarFirebase(){
  let email = document.getElementById('emailLogin').value;
  let pass = document.getElementById('passLogin').value;
  firebase.auth().createUserWithEmailAndPassword(email, pass).then(()=>alert('Akun Dibuat! Silakan Login')).catch(e=>alert('Gagal: '+e.message));
}
function logout(){firebase.auth().signOut();}

// 4. LOAD & SAVE KE FIREBASE
function loadDataDariFirebase(){
  dbRef.ref('dataKasir').on('value', snap => {
    if(snap.val()) db = snap.val();
    tampilBarang(); tampilKasir(); tampilLaporan(); tampilSetting();
  });
}
function save(){
  dbRef.ref('dataKasir').set(db);
}

// 5. FUNGSI UTAMA
function show(id){
  document.querySelectorAll('.box').forEach(b=>b.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function toggleTema(){
  db.tema = db.tema == 'terang' ? 'gelap' : 'terang';
  document.body.className = db.tema == 'gelap' ? 'dark' : '';
  save();
}

function simpanBarang(){
  let k=document.getElementById('kode').value;let n=document.getElementById('nama').value;let h=parseInt(document.getElementById('harga').value);let s=parseInt(document.getElementById('stok').value);
  if(!n||!h||s<0)return alert('Isi lengkap!');
  if(editId){let b=db.barang.find(x=>x.id==editId);b.kode=k;b.nama=n;b.harga=h;b.stok=s;editId=null;}
  else{db.barang.push({id:Date.now(),kode:k,nama:n,harga:h,stok:s});}
  save(); resetForm(); alert('Tersimpan ke Firebase!');
}
function resetForm(){document.getElementById('kode').value='';document.getElementById('nama').value='';document.getElementById('harga').value='';document.getElementById('stok').value='';editId=null;}
function tampilBarang(){
  let html=''; db.barang.forEach(b=>{
    let badge = b.stok==0?'<span class="badge">HABIS</span>':b.stok<=db.batasStok?'<span class="badge kuning">TIPIS</span>':'';
    html+=`<div class="item"><div><b>${b.nama}</b> ${badge}<br>Rp${b.harga.toLocaleString()} | Stok:${b.stok}</div><div class="btn-group"><button onclick="editBarang(${b.id})">Edit</button><button class="merah" onclick="hapusBarang(${b.id})">Hapus</button></div></div>`
  });
  document.getElementById('daftarBarang').innerHTML=html;
}
function editBarang(id){let b=db.barang.find(x=>x.id==id);document.getElementById('kode').value=b.kode;document.getElementById('nama').value=b.nama;document.getElementById('harga').value=b.harga;document.getElementById('stok').value=b.stok;editId=id;show('barang');}
function hapusBarang(id){if(confirm('Hapus?')){db.barang=db.barang.filter(x=>x.id!=id);save();}}

function cariBarang(){
  let q=document.getElementById('cari').value.toLowerCase();
  let html=''; db.barang.filter(b=>b.nama.toLowerCase().includes(q)||b.kode.includes(q)).forEach(b=>{
    if(b.stok>0) html+=`<div class="item"><div>${b.nama} - Rp${b.harga.toLocaleString()} - Stok:${b.stok}</div><button onclick="add(${b.id})">+</button></div>`
  });
  document.getElementById('hasilCari').innerHTML=html;
}
function add(id){let b=db.barang.find(x=>x.id==id);let k=keranjang.find(x=>x.id==id);if(k)k.qty++;else keranjang.push({id:id,nama:b.nama,harga:b.harga,qty:1});tampilKasir();}
function tampilKasir(){
  let html='';let total=0;
  keranjang.forEach(k=>{
    total+=k.harga*k.qty;
    html+=`<div class="keranjang-item"><span>${k.nama} x${k.qty}</span><span>Rp${(k.harga*k.qty).toLocaleString()} <button onclick="kurang(${k.id})">-</button></span></div>`
  });
  document.getElementById('keranjang').innerHTML=html;
  document.getElementById('total').innerText=total.toLocaleString();
}
function kurang(id){let k=keranjang.find(x=>x.id==id);k.qty--;if(k.qty<=0)keranjang=keranjang.filter(x=>x.id!=id);tampilKasir();}
function hitungKembali(){let bayar=parseInt(document.getElementById('bayar').value)||0;let total=parseInt(document.getElementById('total').innerText.replace(/,/g,''));document.getElementById('kembali').innerText=(bayar-total).toLocaleString();}
function bayar(){
  let total=parseInt(document.getElementById('total').innerText.replace(/,/g,''));
  if(total==0)return alert('Keranjang kosong!');
  let bayar=parseInt(document.getElementById('bayar').value);
  if(bayar<total)return alert('Uang kurang!');
  
  keranjang.forEach(k=>{
    let b=db.barang.find(x=>x.id==k.id);b.stok-=k.qty;
  });
  
  db.laporan.push({tanggal:new Date().toLocaleString(), item:keranjang, total:total});
  save();
  
  let struk=`==== ${db.nama} ====\n${new Date().toLocaleString()}\n--------------------\n`;
  keranjang.forEach(k=>struk+=`${k.nama} x${k.qty} = Rp${(k.harga*k.qty).toLocaleString()}\n`);
  struk+=`--------------------\nTOTAL: Rp${total.toLocaleString()}\nBAYAR: Rp${bayar.toLocaleString()}\nKEMBALI: Rp${(bayar-total).toLocaleString()}\n==== TERIMA KASIH ====`;
  document.getElementById('struk').innerText=struk;
  
  keranjang=[];document.getElementById('bayar').value='';tampilKasir();
}

function tampilLaporan(){
  let html=''; db.laporan.slice().reverse().forEach(l=>{
    html+=`<div class="item"><div><b>${l.tanggal}</b><br>Total: Rp${l.total.toLocaleString()}</div></div>`
  });
  document.getElementById('daftarLaporan').innerHTML=html;
}
function resetSemua(){if(confirm('Yakin reset semua?')){db={barang:[], laporan:[], nama:db.nama, tema:db.tema, batasStok:db.batasStok};save();}}

function tampilSetting(){
  document.getElementById('namaWarung').value=db.nama;
  document.getElementById('batasStok').value=db.batasStok;
  document.getElementById('namaWarungHeader').innerText=db.nama + ' - ONLINE';
  document.body.className = db.tema == 'gelap' ? 'dark' : '';
}
function simpanSetting(){
  db.nama=document.getElementById('namaWarung').value;
  db.batasStok=parseInt(document.getElementById('batasStok').value);
  save(); alert('Setting Tersimpan!');
}

function initApp(){
  if(db.tema=='gelap') document.body.className='dark';
}
</script>
</body>
</html>
