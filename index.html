<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARUNG IRWAN MARINIR - KASIR PRO V6.9.8</title>
<style>
body{font-family:Arial; margin:0; background:#f5f5f5}
.header{background:#1565c0; color:white; padding:15px; text-align:center; font-size:18px; font-weight:bold; position:sticky; top:0}
.wrap{padding:10px}
.box{background:#fff; border-radius:10px; padding:15px; margin-bottom:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
input,button{width:100%; padding:12px; margin:5px 0; border-radius:8px; border:1px solid #ddd; font-size:16px}
button{background:#1565c0; color:white; border:none; font-weight:bold}
button.hijau{background:#2e7d32} button.merah{background:#c62828} button.kuning{background:#f9a825; color:#000}
.menu{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px}
.hidden{display:none}
</style>
</head>
<body>

<div id="halamanLogin">
  <div class="box" style="max-width:400px; margin:50px auto">
    <h2 style="text-align:center">🔒 LOGIN KASIR</h2>
    <input id="userLogin" type="text" placeholder="Username: admin" value="admin">
    <input id="passLogin" type="password" placeholder="Password: P" value="P">
    <button class="hijau" onclick="cekLogin()">MASUK</button>
  </div>
</div>

<div id="appUtama" class="hidden">
<div class="header">WARUNG IRWAN MARINIR</div>
<div class="wrap">
  <div class="box menu">
    <button onclick="show('kasir')">KASIR</button>
    <button class="hijau" onclick="show('barang')">BARANG</button>
    <button class="kuning" onclick="show('laporan')">LAPORAN</button>
    <button class="kuning" onclick="show('grafik')">GRAFIK</button>
    <button class="merah" onclick="show('setting')">SETTING</button>
  </div>
  
  <div id="kasir" class="box">
    <h3>KASIR</h3>
    <input id="cari" placeholder="Cari barang..." onkeyup="tampilKasir()">
    <div id="listBarangKasir"></div>
    <hr><h3>KERANJANG</h3><div id="keranjang">Kosong</div>
    <h2>TOTAL: Rp<span id="total">0</span></h2>
    <input id="bayar" type="number" placeholder="Uang Bayar">
    <button class="hijau" onclick="bayar()">BAYAR</button>
  </div>

  <div id="barang" class="box hidden">
    <h3>TAMBAH BARANG</h3>
    <input id="nama" placeholder="Nama Barang">
    <input id="harga" type="number" placeholder="Harga">
    <input id="stok" type="number" placeholder="Stok">
    <button class="hijau" onclick="simpanBarang()">SIMPAN</button>
    <hr><div id="listBarang"></div>
  </div>

  <div id="laporan" class="box hidden">
    <h3>LAPORAN</h3>
    <p>Total: Rp<span id="totalJual">0</span></p>
    <div id="riwayat"></div>
  </div>

  <div id="grafik" class="box hidden"><h3>GRAFIK</h3><p>Fitur grafik</p></div>

  <div id="setting" class="box hidden">
    <h3>SETTING</h3>
    <button onclick="backupData()">BACKUP DATA</button>
    <textarea id="txtBackup" style="height:100px"></textarea>
    <button onclick="restoreData()">RESTORE DATA</button>
    <hr><button class="merah" onclick="resetSemua()">RESET SEMUA</button>
  </div>
</div>
</div>

<script>
const USER = "admin"; const PASS = "P";
let db = JSON.parse(localStorage.getItem('dbKasirPro')) || {barang:[], laporan:[]};
let keranjang = [];

function cekLogin(){
  if(document.getElementById('userLogin').value===USER && document.getElementById('passLogin').value===PASS){
    document.getElementById('halamanLogin').style.display = 'none';
    document.getElementById('appUtama').classList.remove('hidden');
    show('kasir');
  } else { alert('Salah!'); }
}

function show(id){
  document.querySelectorAll('#appUtama .box').forEach(b=>{if(b.id)b.classList.add('hidden')});
  document.getElementById(id).classList.remove('hidden');
  if(id=='kasir')tampilKasir();
  if(id=='barang')tampilBarang();
  if(id=='laporan')tampilLaporan();
}
function save(){localStorage.setItem('dbKasirPro',JSON.stringify(db));}

function simpanBarang(){
  let n=document.getElementById('nama').value; 
  let h=parseInt(document.getElementById('harga').value); 
  let s=parseInt(document.getElementById('stok').value);
  if(!n||!h)return alert('Isi lengkap!');
  db.barang.push({id:Date.now(),nama:n,harga:h,stok:s});
  save(); tampilBarang();
}
function tampilBarang(){
  let html=''; db.barang.forEach(b=>{
    html+=`<div>${b.nama} - Rp${b.harga} - Stok:${b.stok} <button onclick="add(${b.id})">+Keranjang</button></div>`;
  });
  document.getElementById('listBarang').innerHTML=html;
}
function tampilKasir(){
  let key=document.getElementById('cari').value.toLowerCase();
  let html=''; db.barang.filter(b=>b.nama.toLowerCase().includes(key)).forEach(b=>{
    html+=`<div onclick="add(${b.id})">${b.nama} - Rp${b.harga}</div>`;
  });
  document.getElementById('listBarangKasir').innerHTML=html;
}
function add(id){
  let b=db.barang.find(x=>x.id==id);
  let k=keranjang.find(x=>x.id==id); 
  k?k.qty++:keranjang.push({id:b.id,nama:b.nama,harga:b.harga,qty:1});
  tampilKeranjang();
}
function tampilKeranjang(){
  let total=0; let html='';
  keranjang.forEach(k=>{total+=k.harga*k.qty; html+=`${k.nama} x${k.qty}<br>`});
  document.getElementById('keranjang').innerHTML=html||'Kosong';
  document.getElementById('total').innerText=total;
}
function bayar(){
  let total=parseInt(document.getElementById('total').innerText);
  if(total==0)return alert('Kosong');
  db.laporan.push({waktu:new Date().toLocaleString(), total, detail:[...keranjang]});
  save(); keranjang=[]; tampilKeranjang(); alert('Sukses!');
}
function tampilLaporan(){
  let total=0; db.laporan.forEach(l=>total+=l.total);
  document.getElementById('totalJual').innerText=total;
  document.getElementById('riwayat').innerHTML=db.laporan.map(l=>`${l.waktu} - Rp${l.total}`).join('<br>');
}
function backupData(){
  let data=JSON.stringify(db);
  document.getElementById('txtBackup').value=data;
  navigator.clipboard.writeText(data);
  alert('Tercopy!');
}
function restoreData(){
  db=JSON.parse(document.getElementById('txtBackup').value);
  save(); alert('Restore!');
}
function resetSemua(){
  if(confirm('Yakin?')){db={barang:[],laporan:[]}; save();}
}
</script>
</body>
</html>
