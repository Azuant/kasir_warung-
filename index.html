<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Warung - Firebase</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
#loginBox{position:fixed;top:0;left:0;width:100%;height:100%;background:#1a3a6e;display:flex;align-items:center;justify-content:center;z-index:999}
.login-card{background:white;padding:30px;border-radius:10px;width:90%;max-width:350px}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:5px}
.btn{width:100%;padding:12px;background:#28a745;color:white;border:none;border-radius:5px;cursor:pointer;font-size:16px}
.btn:hover{opacity:0.9}
.container{display:none;padding:15px;max-width:1200px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;background:#1a3a6e;color:white;padding:15px;border-radius:8px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:white;padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.produk{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee;cursor:pointer}
.produk:hover{background:#f8f9fa}
.keranjang-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.total{font-size:20px;font-weight:bold;text-align:right;margin-top:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;text-align:left;border-bottom:1px solid #ddd}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginBox">
  <div class="login-card">
    <h2 style="text-align:center;margin-bottom:15px">Login Kasir</h2>
    <input type="email" id="email" placeholder="Email" value="karnotoazuant@gmail.com">
    <input type="password" id="password" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
    <p id="err" style="color:red;text-align:center;margin-top:10px"></p>
  </div>
</div>

<div class="container" id="app">
  <div class="header">
    <h2>Kasir Warung</h2>
    <div><span id="userEmail"></span> | <button style="background:#dc3545" class="btn" onclick="logout()">Logout</button></div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>📦 Daftar Produk</h3>
      <input id="cari" placeholder="Cari produk..." onkeyup="tampilProduk()">
      <div id="listProduk" style="max-height:400px;overflow-y:auto;margin-top:10px"></div>
      <hr style="margin:15px 0">
      <h4>+ Tambah Produk</h4>
      <input id="namaBarang" placeholder="Nama Barang">
      <input id="hargaBarang" type="number" placeholder="Harga">
      <button class="btn" onclick="tambahProduk()">Simpan Produk</button>
    </div>

    <div class="card">
      <h3>🛒 Keranjang</h3>
      <div id="listKeranjang" style="min-height:300px"></div>
      <div class="total">Total: Rp <span id="total">0</span></div>
      <button class="btn" style="background:#007bff;margin-top:10px" onclick="bayar()">Bayar & Simpan</button>
      <button class="btn" style="background:#dc3545;margin-top:5px" onclick="kosongkan()">Kosongkan</button>
    </div>
  </div>

  <div class="card" style="margin-top:15px">
    <h3>📚 Riwayat Transaksi</h3>
    <table id="tabelRiwayat"><thead><tr><th>Tanggal</th><th>Total</th><th>Item</th></tr></thead><tbody></tbody></table>
  </div>
</div>

<script>
// 1. PENTING: GANTI INI DENGAN PUNYA KAMU DARI FIREBASE CONSOLE
var firebaseConfig = {
  apiKey: "GANTI_APIKEY_KAMU",
  authDomain: "GANTI_AUTH_DOMAIN",
  databaseURL: "GANTI_DATABASE_URL",
  projectId: "GANTI_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var auth = firebase.auth();
var userId = "";

var produk = [];
var keranjang = [];

function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
.then(user => {
    userId = user.user.uid;
    document.getElementById('loginBox').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('userEmail').innerText = user.user.email;
    loadData();
  })
.catch(error => { err.innerText = error.message; });
}
function logout(){ auth.signOut(); location.reload(); }

function loadData(){
  db.ref('kasir/' + userId + '/produk').on('value', snap => {
    produk = snap.val() || [];
    tampilProduk();
  });
  db.ref('kasir/' + userId + '/keranjang').on('value', snap => {
    keranjang = snap.val() || [];
    tampilKeranjang();
  });
  db.ref('kasir/' + userId + '/riwayat').on('value', snap => {
    let riwayat = snap.val() || [];
    let html = '';
    Object.values(riwayat).reverse().forEach(r => {
      html += `<tr><td>${r.tanggal}</td><td>Rp ${r.total.toLocaleString('id-ID')}</td><td>${r.item} item</td></tr>`;
    });
    document.querySelector('#tabelRiwayat tbody').innerHTML = html;
  });
}

function tambahProduk(){
  if(!namaBarang.value ||!hargaBarang.value) return alert('Isi semua!');
  produk.push({nama: namaBarang.value, harga: Number(hargaBarang.value)});
  db.ref('kasir/' + userId + '/produk').set(produk);
  namaBarang.value=''; hargaBarang.value='';
  alert('Produk tersimpan!');
}

function tampilProduk(){
  let cari = document.getElementById('cari').value.toLowerCase();
  let html = '';
  produk.filter(p=>p.nama.toLowerCase().includes(cari)).forEach((p,i)=>{
    html += `<div class="produk" onclick="addKeranjang(${i})"><span>${p.nama}</span><span>Rp ${p.harga.toLocaleString('id-ID')}</span></div>`;
  });
  listProduk.innerHTML = html;
}

function addKeranjang(i){
  let item = produk[i];
  let exist = keranjang.find(k=>k.nama==item.nama);
  if(exist){ exist.qty++; } else { keranjang.push({...item, qty:1}); }
  db.ref('kasir/' + userId + '/keranjang').set(keranjang);
}

function tampilKeranjang(){
  let html=''; let total=0;
  keranjang.forEach((k,i)=>{
    total += k.harga * k.qty;
    html += `<div class="keranjang-item"><span>${k.nama} x${k.qty}</span><span>Rp ${(k.harga*k.qty).toLocaleString('id-ID')} <button onclick="hapusItem(${i})">X</button></span></div>`;
  });
  listKeranjang.innerHTML = html;
  document.getElementById('total').innerText = total.toLocaleString('id-ID');
}

function hapusItem(i){ keranjang.splice(i,1); db.ref('kasir/' + userId + '/keranjang').set(keranjang); }
function kosongkan(){ keranjang=[]; db.ref('kasir/' + userId + '/keranjang').set(keranjang); }

function bayar(){
  if(keranjang.length==0) return alert('Keranjang kosong!');
  let total = keranjang.reduce((a,b)=>a+(b.harga*b.qty),0);
  let transaksi = {
    tanggal: new Date().toLocaleString('id-ID'),
    total: total,
    item: keranjang.length,
    detail: keranjang
  };
  db.ref('kasir/' + userId + '/riwayat').push(transaksi);
  kosongkan();
  alert('Transaksi tersimpan!');
}
</script>
</body>
</html>      <div id="hasilFilter" style="margin-top:10px; font-weight:bold; color:green;"></div>
    </div>

    <button class="merah" onclick="resetLaporan()">RESET LAPORAN</button>
    <hr><h4>RIWAYAT TRANSAKSI</h4><div id="riwayat" class="list"></div>
  </div>
  <div id="grafik" class="box hidden"><h3>📈 GRAFIK 7 HARI TERAKHIR</h3><canvas id="chart" height="250"></canvas></div>
  <div id="setting" class="box hidden">
    <h3>⚙️ PENGATURAN</h3>
    <input id="inputNamaWarung" placeholder="Nama Warung">
    <label><b>Batas Stok TIPIS:</b></label>
    <input id="inputBatasStok" type="number" placeholder="Contoh: 5">
    <small>Jika stok <= angka ini maka status TIPIS KUNING</small>
    <button onclick="simpanSetting()">SIMPAN PENGATURAN</button>
    <hr><button onclick="backupData()">BACKUP DATA KE CLIPBOARD</button>
    <button onclick="restoreData()">RESTORE DATA</button>
    <hr><button class="merah" onclick="resetSemua()">RESET SEMUA DATA</button>
  </div>
</div>
</div>

<script>
const USER = "admin";
const PASS = "P";

let db = JSON.parse(localStorage.getItem('dbKasirPro')) || {barang:[], laporan:[], nama:"WARUNG IRWAN MARINIR", tema:"terang", batasStok:5};
let keranjang = []; let editId = null; let html5QrCode = null; let scannerAktif = null; let isScanning = false; let strukTerakhir = "";

function cekLogin(){
  let u = document.getElementById('userLogin').value;
  let p = document.getElementById('passLogin').value;
  if(u===USER && p===PASS){
    localStorage.setItem('loginKasir', 'true');
    document.getElementById('halamanLogin').style.display = 'none';
    document.getElementById('appUtama').style.display = 'block';
    initApp();
  } else { alert('Username atau Password Salah!'); }
}
function logout(){localStorage.removeItem('loginKasir'); location.reload();}
function initApp(){if(db.tema=='gelap') document.body.classList.add('dark'); show('kasir');}
window.addEventListener('load', function(){if(localStorage.getItem('loginKasir')==='true'){document.getElementById('halamanLogin').style.display = 'none';document.getElementById('appUtama').style.display = 'block';initApp();}});

async function stopScanner(){if(html5QrCode && isScanning){isScanning=false;try{await html5QrCode.stop();}catch(e){}html5QrCode.clear();html5QrCode=null;}document.querySelectorAll('[id^=reader]').forEach(r=>r.classList.add('hidden'));scannerAktif=null;}
function toggleTema(){document.body.classList.toggle('dark');db.tema=document.body.classList.contains('dark')?'gelap':'terang';save();}
function show(id){stopScanner();document.querySelectorAll('.box').forEach(b=>{if(b.id)b.classList.add('hidden')});document.getElementById(id).classList.remove('hidden');document.getElementById('namaWarungHeader').innerText=db.nama.toUpperCase() + " - SELAMAT DATANG";document.getElementById('inputNamaWarung').value=db.nama;document.getElementById('inputBatasStok').value=db.batasStok;if(id=='kasir')tampilKasir();if(id=='barang')tampilBarang();if(id=='laporan')tampilLaporan();if(id=='grafik')gambarGrafik();}
function save(){localStorage.setItem('dbKasirPro',JSON.stringify(db));}
function simpanBarang(){let k=document.getElementById('kode').value;let n=document.getElementById('nama').value;let h=parseInt(document.getElementById('harga').value);let s=parseInt(document.getElementById('stok').value);if(!n||!h||s<0)return alert('Isi lengkap!');if(editId){let b=db.barang.find(x=>x.id==editId);b.kode=k;b.nama=n;b.harga=h;b.stok=s;editId=null;}else{db.barang.push({id:Date.now(),kode:k,nama:n,harga:h,stok:s});}save();document.getElementById('kode').value='';document.getElementById('nama').value='';document.getElementById('harga').value='';document.getElementById('stok').value='';tampilBarang();alert('Tersimpan!');}
function tampilBarang(){let html='';db.barang.forEach(b=>{let stokBadge;if(b.stok<=0){stokBadge='<span class="badge">HABIS</span>';}else if(b.stok<=db.batasStok){stokBadge='<span class="badge kuning">TIPIS</span>';}else{stokBadge='<span class="badge hijau">AMAN</span>';}html+=`<div class="item"><div class="info"><b>${b.nama}</b> ${stokBadge}<br><small>Kode:${b.kode||'-'} | Stok: ${b.stok} | Rp${b.harga.toLocaleString()}</small></div><div class="btn-group"><button class="kuning" onclick="editBarang(${b.id})">Edit</button><button class="merah" onclick="hapusBarang(${b.id})">Hapus</button></div></div>`;});document.getElementById('listBarang').innerHTML=html||'Belum ada barang';}
function editBarang(id){let b=db.barang.find(x=>x.id==id);document.getElementById('kode').value=b.kode||'';document.getElementById('nama').value=b.nama;document.getElementById('harga').value=b.harga;document.getElementById('stok').value=b.stok;editId=id;show('barang');}
function hapusBarang(id){if(confirm('Hapus barang ini?')){db.barang=db.barang.filter(b=>b.id!=id);save();tampilBarang();}}
function tampilKasir(){let key=document.getElementById('cari').value.toLowerCase();let html='';db.barang.forEach(b=>{if(b.nama.toLowerCase().includes(key)||(b.kode&&b.kode.includes(key))){let disabled=b.stok<=0?'style="opacity:0.5; cursor:not-allowed"':`onclick="add(${b.id})"`;let badge=b.stok<=0?'<span class="badge">HABIS</span>':b.stok<=db.batasStok?'<span class="badge kuning">TIPIS</span>':'<span class="badge hijau">AMAN</span>';html+=`<div class="item" ${disabled}><div class="info"><b>${b.nama}</b> ${badge}<br><small>Kode:${b.kode||'-'} | Rp${b.harga.toLocaleString()}</small></div></div>`;}});document.getElementById('listBarangKasir').innerHTML=html||'Barang tidak ditemukan';}
function add(id){let b=db.barang.find(x=>x.id==id);if(b.stok<=0)return alert('Stok habis!');let k=keranjang.find(x=>x.id==id);if(k){if(k.qty>=b.stok)return alert('Stok tidak cukup!');k.qty++;}else{keranjang.push({id:b.id,nama:b.nama,harga:b.harga,qty:1});}tampilKeranjang();}
function tampilKeranjang(){if(keranjang.length==0){document.getElementById('keranjang').innerHTML='Kosong';document.getElementById('total').innerText='0';return;}let total=0;let html='';keranjang.forEach((k,i)=>{let sub=k.harga*k.qty;total+=sub;html+=`<div class="keranjang-item"><span>${k.nama} x${k.qty}</span><span>Rp${sub.toLocaleString()} <button style="width:auto;padding:2px 8px;background:red" onclick="hapusKeranjang(${i})">X</button></span></div>`;});document.getElementById('keranjang').innerHTML=html;document.getElementById('total').innerText=total.toLocaleString();hitungKembali();}
function hapusKeranjang(i){keranjang.splice(i,1);tampilKeranjang();}
function hitungKembali(){let total=parseInt(document.getElementById('total').innerText.replace(/\./g,''))||0;let bayar=parseInt(document.getElementById('bayar').value)||0;document.getElementById('kembali').innerText=(bayar-total).toLocaleString();}
function bayar(){let total=parseInt(document.getElementById('total').innerText.replace(/\./g,''))||0;let bayar=parseInt(document.getElementById('bayar').value)||0;if(total==0)return alert('Keranjang kosong');if(bayar<total)return alert('Uang kurang!');keranjang.forEach(k=>{let b=db.barang.find(x=>x.id==k.id);b.stok-=k.qty;});let trx={waktu:new Date().toLocaleString('id-ID'),total:total,bayar:bayar,kembali:bayar-total,detail:[...keranjang]};db.laporan.push(trx);save();buatStruk(trx);cetakBluetooth(strukTerakhir);alert('TRANSAKSI SUKSES!');batal();}
function buatStruk(trx){let tgl=trx.waktu;let struk=`${db.nama}\n============================\n${tgl}\n============================\n`;trx.detail.forEach(d=>{let nama = d.nama.length > 20? d.nama.substring(0,20) : d.nama;struk+=`${nama}\n ${d.qty} x ${d.harga.toLocaleString()} = ${ (d.qty*d.harga).toLocaleString() }\n`});struk+=`============================\nTOTAL : Rp${trx.total.toLocaleString()}\nBAYAR : Rp${trx.bayar.toLocaleString()}\nKEMBALI : Rp${trx.kembali.toLocaleString()}\n============================\nTERIMA KASIH\n`;strukTerakhir = struk;document.getElementById('struk').innerText=struk;document.getElementById('struk').classList.remove('hidden');navigator.clipboard.writeText(struk);}
async function cetakBluetooth(teks){if(!navigator.bluetooth){ alert('Browser tidak support Bluetooth. Pakai Chrome Android'); return; }try {alert('Mencari Printer Bluetooth...');const device = await navigator.bluetooth.requestDevice({acceptAllDevices: true,optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']});const server = await device.gatt.connect();const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');const characteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');const encoder = new TextEncoder();const data = encoder.encode(teks);await characteristic.writeValue(data);alert('Struk terkirim ke printer: ' + device.name);} catch(error) {alert('Gagal print: ' + error.message + '\n\nPastikan Bluetooth nyala & printer sudah di-pair');}}
function printUlang(){if(strukTerakhir=="") return alert("Belum ada transaksi");cetakBluetooth(strukTerakhir);}
function batal(){keranjang=[];document.getElementById('bayar').value='';document.getElementById('struk').classList.add('hidden');tampilKeranjang();tampilKasir();}

function parseTanggal(tglString){let [tgl,jam] = tglString.split(', ');let [d,m,y] = tgl.split('/');return new Date(y,m-1,d);}

function tampilLaporan(dataFilter = db.laporan){
  let total=0; dataFilter.forEach(l=>total+=l.total);
  document.getElementById('totalJual').innerText=total.toLocaleString();
  document.getElementById('jmlTrx').innerText=dataFilter.length;
  let html='';
  for(let i=dataFilter.length-1;i>=0;i--){
    let l=dataFilter[i]; let tgl=l.waktu;
    html+=`<div class="item"><div class="info"><b>${tgl}</b><br>`;
    l.detail.forEach(d=>html+=`${d.nama} x${d.qty}<br>`);
    html+=`</div><div><b>Rp${l.total.toLocaleString()}</b></div></div>`;
  }
  document.getElementById('riwayat').innerHTML=html||'Belum ada';
  document.getElementById('hasilFilter').innerHTML = '';
}

function resetFilter(){
  document.getElementById('filterHarian').value = '';
  document.getElementById('filterBulanan').value = '';
  tampilLaporan();
}

function filterHarian(){let tgl = document.getElementById('filterHarian').value; if(!tgl) return alert('Pilih tanggal dulu');let [y,m,d] = tgl.split('-');let hasil = db.laporan.filter(l => {let dt = parseTanggal(l.waktu);return dt.getDate()==parseInt(d) && dt.getMonth()+1==parseInt(m) && dt.getFullYear()==parseInt(y);});tampilLaporan(hasil);let total = hasil.reduce((sum,l)=>sum+l.total,0);document.getElementById('hasilFilter').innerHTML = `Hasil ${d}/${m}/${y}: ${hasil.length} transaksi, Total Rp${total.toLocaleString()}`;}
function filterBulanan(){let bln = document.getElementById('filterBulanan').value; if(!bln) return alert('Pilih bulan dulu');let [y,m] = bln.split('-');let hasil = db.laporan.filter(l => {let dt = parseTanggal(l.waktu);return dt.getMonth()+1==parseInt(m) && dt.getFullYear()==parseInt(y);});tampilLaporan(hasil);let total = hasil.reduce((sum,l)=>sum+l.total,0);document.getElementById('hasilFilter').innerHTML = `Hasil ${m}/${y}: ${hasil.length} transaksi, Total Rp${total.toLocaleString()}`;}

function gambarGrafik(){const ctx=document.getElementById('chart').getContext('2d');const width=ctx.canvas.width=ctx.canvas.parentElement.clientWidth;ctx.clearRect(0,0,width,250);let data7hari=[]; let labels=[];for(let i=6;i>=0;i--){let tgl=new Date(); tgl.setDate(tgl.getDate()-i);let total=db.laporan.filter(l=>{let dt=parseTanggal(l.waktu); return dt.toDateString()==tgl.toDateString();}).reduce((sum,l)=>sum+l.total,0);data7hari.push(total); labels.push(tgl.toLocaleDateString('id-ID',{weekday:'short'}));}const warna = ['#e65100', '#1565c0', '#2e7d32', '#6a1b9a', '#f9a825', '#c62828', '#0277bd'];let max=Math.max(...data7hari,10000); let barWidth=(width-20)/7-10;data7hari.forEach((val,i)=>{let h=max>0?(val/max)*200:0; let x = i*(barWidth+10)+10;ctx.fillStyle=warna[i]; ctx.fillRect(x,230-h,barWidth,h);ctx.fillStyle='var(--text)'; ctx.font='bold 12px Arial'; ctx.textAlign='center'; ctx.fillText(labels[i], x+barWidth/2, 245);ctx.font='11px Arial'; ctx.fillText('Rp'+(val/1000)+'k', x+barWidth/2, 225-h);});}
async function toggleScanner(tempat){if(scannerAktif==tempat){await stopScanner();return;}await stopScanner();const readerDiv=document.getElementById('reader-'+tempat);readerDiv.classList.remove('hidden');scannerAktif=tempat;isScanning=true;html5QrCode=new Html5Qrcode("reader-"+tempat);html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:250},async(decodedText)=>{if(!isScanning)return;await stopScanner();if(tempat=='barang'){document.getElementById('kode').value=decodedText;alert('Kode: '+decodedText+' sudah terisi.');}if(tempat=='kasir'){let b=db.barang.find(x=>x.kode==decodedText);if(b){add(b.id);}else{alert('Barang dengan kode '+decodedText+' tidak ditemukan!');}}},(errorMessage)=>{}).catch(err=>{alert('Gagal buka kamera: '+err+'\n\nCoba buka di Chrome dan izinkan kamera');stopScanner();});}
function resetLaporan(){if(confirm('Reset laporan?')){db.laporan=[];save();tampilLaporan();}}
function simpanSetting(){db.nama=document.getElementById('inputNamaWarung').value||"WARUNG IRWAN MARINIR";db.batasStok=parseInt(document.getElementById('inputBatasStok').value)||5;save();show('kasir');alert('Pengaturan Tersimpan!');}
function backupData(){navigator.clipboard.writeText(JSON.stringify(db));alert('Data sudah di-copy!');}
function restoreData(){let data=prompt('Paste data backup:');if(data){try{db=JSON.parse(data);save();alert('Restore berhasil!');show('kasir');}catch(e){alert('Data rusak!')}}
}
function resetSemua(){if(confirm('YAKIN HAPUS SEMUA?')){db={barang:[],laporan:[],nama:db.nama,tema:db.tema,batasStok:5};save();show('kasir');alert('Data direset');}}
</script>
</body>
</html>
